[profile.default]
src = "src"
out = "out"
script = "script"
libs = ["lib"]
solc_version = '0.8.34'
optimizer = true
optimizer_runs = 200
fs_permissions = [
    { access = "read", path = "./script/input/"},
    { access = "read-write", path = "./script/output/"}
]
evm_version = 'cancun'
remappings = []

[fuzz]
runs = 1000

[invariant]
runs = 1
depth = 100

[etherscan]
mainnet = { key = "${MAINNET_API_KEY}" }

# See more config options https://github.com/foundry-rs/foundry/tree/master/config
